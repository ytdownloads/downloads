<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/downloads/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YTdownloader</title>
    <meta name="description" content="YTdownloader - Fast, modern YouTube video & playlist downloader with real-time processing and quality selection." />
    <meta property="og:title" content="YTdownloader" />
    <meta property="og:description" content="Fast, modern YouTube video & playlist downloader with real-time processing and quality selection." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YTdownloader" />
    <meta name="theme-color" content="#0b0f19" />
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('ytdl_theme_preference') || 'system';
          var isDark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#070b14] text-slate-900 dark:text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
