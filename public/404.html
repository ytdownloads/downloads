<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YTdownloader</title>
    <script>
      // Single Page App redirect for GitHub Pages project hosting under /downloads/
      var path = window.location.pathname;
      var clean = path.replace(/^\/downloads\/?/, '');
      if (clean) {
        window.location.replace('/downloads/#' + clean);
      } else {
        window.location.replace('/downloads/');
      }
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/downloads/">YTdownloader</a>...</p>
  </body>
</html>
